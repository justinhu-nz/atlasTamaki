<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Tāmaki editor</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script defer src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script defer src="ideas.js"></script>
<script defer src="image-manifest.js"></script>
<script defer src="atlas.js"></script>
<script defer src="basemaps.js"></script>
<script defer src="data/railways.js"></script>
<script defer src="transport-layers.js"></script>
<link rel="stylesheet" href="atlas.css">
<script defer src="editor.js"></script>
<style>
  :root { --fg:#1d2228; --muted:#5f6b76; --line:#e3e6ea; --chip:#f3f4f6; --side:400px; --accent:#1c7ed6; --ok:#2b8a3e; --warn:#c2410c; --warnbg:#fff4e6; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--fg); background:#fff; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  #map, #layer { position:absolute; top:0; left:0; bottom:0; right:var(--side); }
  #layer { pointer-events:none; overflow:hidden; z-index:2; }
  body.drawing #layer { opacity:.6; }
  body.drawing #layer .st, body.drawing #layer .im { pointer-events:none; }
  body.drawing #map canvas { cursor:crosshair; }

  /* Pictures at true scale */
  .im { position:absolute; left:0; top:0; width:0; height:0; pointer-events:auto; cursor:move; z-index:70; }
  .im img { width:100%; height:100%; display:block; pointer-events:none; user-select:none; }
  .im.sel { outline:2px dashed var(--fg); }
  .im .h { display:none; position:absolute; width:18px; height:18px; background:#fff; border:2px solid var(--fg); border-radius:50%; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .im.sel .h { display:block; }
  .im .scale { border-radius:4px; }
  .im .nw { left:-10px; top:-10px; cursor:nwse-resize; } .im .ne { right:-10px; top:-10px; cursor:nesw-resize; }
  .im .se { right:-10px; bottom:-10px; cursor:nwse-resize; } .im .sw { left:-10px; bottom:-10px; cursor:nesw-resize; }
  .im.picking, .im.picking * { cursor:crosshair !important; }
  .im.through { pointer-events:none; }
  .im.through .h, .im.through .stick { display:none; }
  .im .pin { position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; border:2px solid #e03131; background:rgba(224,49,49,.15); pointer-events:none; }
  .im .pin::before, .im .pin::after { content:""; position:absolute; background:#e03131; }
  .im .pin::before { left:50%; top:-6px; bottom:-6px; width:2px; margin-left:-1px; }
  .im .pin::after { top:50%; left:-6px; right:-6px; height:2px; margin-top:-1px; }
  .mdot { position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; background:#1c7ed6; color:#fff; border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.4); font:700 12px/18px system-ui; text-align:center; pointer-events:none; }
  .mdot::before { content:attr(data-n); }
  #mapDots { position:absolute; inset:0; pointer-events:none; z-index:71; }
  #layer.blend { mix-blend-mode:multiply; }
  .im .rot { left:50%; top:-38px; margin-left:-9px; cursor:grab; }
  .im .stick { display:none; position:absolute; left:50%; top:-20px; height:20px; border-left:2px solid var(--fg); }
  .im.sel .stick { display:block; }

  /* Floating map controls */
  .float { position:absolute; left:calc((100% - var(--side)) / 2); transform:translateX(-50%); top:12px; z-index:6; background:#fff; border-radius:12px;
    box-shadow:0 4px 18px rgba(0,0,0,.2); padding:8px 10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; max-width:calc(100% - var(--side) - 24px); }
  .float[hidden] { display:none; }
  .float .tip { color:var(--muted); font-size:12.5px; flex-basis:100%; }
  .float label { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); margin:0; font-weight:400; }
  .float input[type=range] { width:100px; }
  .float .tg { display:flex; align-items:center; gap:4px; flex-wrap:wrap; padding-right:8px; margin-right:4px; border-right:1px solid var(--line); }
  .float .tg:last-child { border-right:0; flex-basis:100%; padding:6px 0 0; margin:0; border-top:1px solid var(--line); }
  .float .tl { font-size:12px; color:var(--muted); margin-right:2px; }
  .float .btn.small { padding:3px 7px; }
  #mapHint { position:absolute; left:56px; bottom:30px; z-index:4; background:rgba(255,255,255,.95); padding:7px 12px; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.18); font-size:13px; max-width:calc(100% - var(--side) - 24px); }
  #mapHint:empty { display:none; }
  #drop { position:absolute; inset:12px calc(var(--side) + 12px) 12px 12px; border:3px dashed var(--accent); border-radius:14px; background:rgba(28,126,214,.1);
    display:none; align-items:center; justify-content:center; text-align:center; padding:20px; font-size:20px; font-weight:600; color:var(--accent); z-index:10; pointer-events:none; }
  #drop.on { display:flex; }

  /* Buttons and fields */
  .btn { border:1px solid #ccd1d6; background:#fff; border-radius:7px; padding:5px 11px; white-space:nowrap; }
  .btn:hover:not(:disabled) { background:var(--chip); }
  .btn:disabled { opacity:.4; cursor:default; }
  #save:disabled { opacity:1; background:#fff; border-color:#ccd1d6; color:var(--ok); font-weight:600; }
  .btn.on { background:var(--fg); color:#fff; border-color:var(--fg); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .btn.primary:hover:not(:disabled) { background:#1971c2; }
  .btn.ghost { border-color:transparent; background:none; }
  .btn.danger { color:#c92a2a; }
  .btn.small { padding:3px 8px; font-size:13px; }
  input[type=text], input[type=url], input[type=search], input[type=number], select, textarea { width:100%; padding:7px 9px; border:1px solid #ccd1d6; border-radius:7px; background:#fff; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(28,126,214,.15); }
  textarea { resize:none; min-height:38px; overflow:hidden; line-height:1.45; }
  label { display:block; margin-top:12px; font-size:12.5px; font-weight:600; }
  label > input, label > select, label > textarea { margin-top:4px; font-weight:400; }
  label .note { font-weight:400; color:var(--muted); }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { min-width:0; }
  .row > input { flex:1; }
  .row > .btn { flex:none; }
  .hint { color:var(--muted); font-size:12.5px; margin:6px 0 0; }
  .placement { margin-top:12px; }
  .placement summary { cursor:pointer; font-size:12.5px; font-weight:600; }
  .placement-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }

  /* Sidebar */
  #side { position:absolute; top:0; right:0; bottom:0; width:var(--side); display:flex; flex-direction:column; border-left:1px solid var(--line); background:#fff; z-index:5; }
  #side > header { padding:10px 12px 10px 16px; border-bottom:1px solid var(--line); display:flex; gap:4px; align-items:center; }
  #side > header b { font-size:15px; margin-right:auto; }
  #side > header a { color:var(--accent); font-size:13px; margin-left:6px; text-decoration:none; }
  #serverNote { background:var(--warnbg); color:var(--warn); font-size:12.5px; padding:8px 16px; border-bottom:1px solid #ffd8a8; }
  #serverNote code { background:#fff; padding:0 4px; border-radius:3px; }
  #body { flex:1; overflow-y:auto; padding:14px 16px 28px; }
  #side > footer { border-top:1px solid var(--line); padding:10px 16px; display:flex; gap:10px; align-items:center; }
  #saveInfo { font-size:12.5px; color:var(--muted); flex:1; }
  #saveInfo.warn { color:var(--warn); }
  #saveInfo button { border:0; background:none; color:var(--accent); padding:0; text-decoration:underline; }
  #save.dirty::after { content:" •"; }

  /* Home: guide and list of ideas */
  .guide { background:var(--chip); border-radius:10px; padding:12px 14px; margin-bottom:14px; }
  .guide b { display:block; margin-bottom:4px; }
  .guide ol { margin:0; padding-left:20px; color:#3b4550; }
  .guide li { margin:3px 0; }
  .grp { margin-top:16px; }
  .grp h3 { display:flex; align-items:center; gap:7px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 4px; }
  .grp h3 i, .dot { width:10px; height:10px; border-radius:50%; display:inline-block; flex:none; }
  .ideaRow { display:grid; grid-template-columns:52px 1fr; gap:10px; align-items:center; width:100%; text-align:left; border:0; background:none; padding:6px; border-radius:8px; }
  .ideaRow:hover { background:var(--chip); }
  .ideaRow img { width:52px; height:38px; object-fit:cover; border-radius:5px; background:var(--chip); }
  .ideaRow b { display:block; font-weight:600; }
  .ideaRow small { display:block; font-size:12px; }
  .ok { color:var(--ok); }
  .miss { color:var(--warn); }

  /* An idea */
  .back { border:0; background:none; color:var(--accent); padding:0; margin-bottom:8px; }
  .ideaHead { display:flex; align-items:center; gap:8px; margin:0 0 10px; font-size:19px; line-height:1.25; }
  .checks { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px; }
  .checks button { border:0; border-radius:999px; padding:2px 9px; font-size:12px; }
  .checks .ok { background:#ebfbee; }
  .checks .miss { background:var(--warnbg); }
  #body section { border-top:1px solid var(--line); margin-top:18px; padding-top:12px; }
  #body section > h3 { margin:0; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); display:flex; align-items:center; gap:8px; }
  #body section > h3 small { text-transform:none; letter-spacing:0; font-weight:400; }
  .cats { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .cats label { margin:0; display:flex; align-items:center; gap:6px; border:1px solid #ccd1d6; border-radius:999px; padding:4px 11px 4px 9px; font-weight:400; cursor:pointer; }
  .cats input { position:absolute; opacity:0; pointer-events:none; }
  .cats label:has(input:checked) { border-color:var(--fg); background:var(--fg); color:#fff; }
  .cats label:has(input:focus-visible) { outline:2px solid var(--accent); }
  .imgcard { border:1px solid var(--line); border-radius:10px; margin-top:8px; overflow:hidden; }
  .imgcard.sel { border-color:var(--fg); box-shadow:0 0 0 1px var(--fg); }
  .ihead { display:grid; grid-template-columns:64px 1fr auto; gap:10px; align-items:center; padding:7px; width:100%; border:0; background:none; text-align:left; }
  .ihead img { width:64px; height:46px; object-fit:cover; border-radius:5px; background:var(--chip); }
  .ihead b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .ihead small { display:block; color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ihead .main { font-size:11px; background:var(--chip); border-radius:4px; padding:1px 6px; color:var(--muted); }
  .ibody { padding:0 10px 10px; }
  .group-pictures { margin-top:12px; border:1px solid var(--line); border-radius:8px; padding:10px; }
  .group-pictures summary { cursor:pointer; font-weight:600; }
  .group-pictures select { display:block; width:100%; padding:8px; margin-top:4px; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  .group-choice { display:flex; align-items:center; gap:8px; font-weight:400; }
  .group-choice input { width:auto; flex:none; }
  .group-choice img { width:48px; height:34px; object-fit:cover; border-radius:3px; }
  .ibody label { margin-top:8px; }
  .warnline { background:var(--warnbg); color:var(--warn); border-radius:6px; padding:6px 9px; font-size:12.5px; margin:8px 0 0; }
  .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .dropzone { margin-top:8px; border:2px dashed #ccd1d6; border-radius:10px; padding:14px; text-align:center; color:var(--muted); }
  .dropzone button { margin-top:6px; }
  .src { display:grid; grid-template-columns:1fr 1.3fr auto; gap:6px; margin-top:6px; }
  .danger-zone { text-align:right; }

  @media (max-width:760px) {
    :root { --side:0px; }
    #map, #layer { bottom:50%; right:0; }
    #side { top:50%; width:100%; border-left:0; border-top:1px solid var(--line); }
    #drop { inset:12px 12px 52% 12px; }
    .float { left:50%; max-width:calc(100% - 24px); padding:6px 8px; }
    .float .tip, #side > header a { display:none; }
    /* Narrow screens: keep the toolbar small; turning and resizing use the handles or keyboard. */
    #tools .tg:has([data-rot]), #tools .tg:has([data-scale]) { display:none; }
    #tools .tg { border-right:0; }
    #mapHint { max-width:calc(100% - 24px); bottom:auto; top:calc(50% - 44px); }
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="layer"><svg id="ties"></svg></div>
<div id="mapHint"></div>
<div id="drop"></div>

<div class="float" id="tools" hidden>
  <span class="tip" id="toolTip"></span>
  <div class="tg">
    <button class="btn small" id="matchBtn" title="Click two landmarks on the picture and where they are on the map, and the picture lines itself up">Match 2 points</button>
    <button class="btn small" id="pinBtn" title="Pick a point on the picture to resize and turn around (or double-click the picture)">📍 Pin a point</button>
  </div>
  <div class="tg"><span class="tl">Turn</span>
    <button class="btn small" data-rot="-5" title="Turn left 5° (Shift+[)">↺5°</button><button class="btn small" data-rot="-0.1" title="Turn left 0.1° ([); Alt+[ turns 0.01°">↺0.1°</button>
    <button class="btn small" data-rot="0.1" title="Turn right 0.1° (]); Alt+] turns 0.01°">↻0.1°</button><button class="btn small" data-rot="5" title="Turn right 5° (Shift+])">↻5°</button>
    <button class="btn small" id="straighten" title="Straighten to 0°">0°</button>
    <span class="tl">Hold Shift while dragging to snap to right angles</span></div>
  <div class="tg"><span class="tl">Size</span>
    <button class="btn small" data-scale="0.9" title="10% smaller (Shift+−)">−10%</button><button class="btn small" data-scale="0.99" title="1% smaller (−)">−1%</button>
    <button class="btn small" data-scale="1.01" title="1% bigger (=)">+1%</button><button class="btn small" data-scale="1.1" title="10% bigger (Shift+=)">+10%</button></div>
  <div class="tg">
    <label>See-through <input type="range" id="op" min="0.15" max="1" step="0.05" value="0.7"></label>
    <button class="btn small" id="blendBtn" title="Make the white parts of the picture see-through, so the streets show through">Hide white</button>
    <button class="btn small" id="peekBtn" title="Hold to hide the picture for a moment (or hold Space)">Peek</button></div>
  <div class="tg"><span class="tl" id="readout"></span><span style="flex:1"></span>
    <button class="btn small" id="toolZoom">Zoom to it</button><button class="btn small primary" id="toolDone">Done</button></div>
</div>
<div class="float" id="drawBar" hidden>
  <span class="tip" id="drawTip"></span>
  <button class="btn small" id="drawUndo">Undo last point</button>
  <button class="btn small primary" id="drawDone">Done</button>
</div>

<aside id="side">
  <header>
    <b>Atlas Tāmaki editor</b>
    <button class="btn ghost" id="undo" title="Undo (⌘Z / Ctrl+Z)" aria-label="Undo" disabled>↶</button>
    <button class="btn ghost" id="redo" title="Redo (⇧⌘Z / Ctrl+Y)" aria-label="Redo" disabled>↷</button>
    <a id="viewLink" href="index.html" target="_blank" title="Open the public map in a new tab">View map ↗</a>
  </header>
  <div id="serverNote" hidden>Save downloads ideas.js with new pictures included. For saving straight into the project, run <code>python3 server.py 8766</code> in the project folder and open <code>http://localhost:8766/editor.html</code>.</div>
  <div id="body"></div>
  <footer><button class="btn primary" id="save" title="Save (⌘S / Ctrl+S)">Save</button><span id="saveInfo">No changes yet</span></footer>
</aside>
<input type="file" id="file" accept="image/*" hidden>


</body>
</html>
